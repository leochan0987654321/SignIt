<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<!-- ============ iOS 原生 App 體驗 ============ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="簽到">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#F2F8FF">
<meta name="color-scheme" content="light">

<title>簽到</title>

<style>
/* ============ 基礎 ============ */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;
  background:#08182E;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
  position:fixed;
  width:100%;
  -webkit-user-select:none;user-select:none;
}
body{display:grid;place-items:center;}

/* ============ 啟動畫面 ============ */
#splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(170deg,#FFFFFF 0%,#EAF2FF 60%,#DBE8FF 100%);
  transition:opacity .55s ease, visibility .55s ease;
}
#splash.hide{opacity:0;visibility:hidden;}
#splash .logo{
  width:96px;height:96px;border-radius:26px;
  background:linear-gradient(160deg,#7FB4FF,#2F6FE4);
  display:grid;place-items:center;
  box-shadow:0 16px 40px rgba(47,111,228,.32),inset 0 1px 0 rgba(255,255,255,.5);
  animation:logoIn .7s cubic-bezier(.34,1.56,.64,1);
}
#splash .logo svg{width:52px;height:52px;}
#splash .app-name{
  margin-top:20px;
  font-size:17px;font-weight:900;color:#1B3A75;
  letter-spacing:.3em;
  padding-left:.3em;
  animation:nameIn .7s cubic-bezier(.34,1.56,.64,1) .12s backwards;
}
#splash .dots{
  margin-top:34px;display:flex;gap:7px;
  animation:nameIn .7s ease .3s backwards;
}
#splash .dots i{
  width:7px;height:7px;border-radius:50%;
  background:#7FB4FF;
  animation:dotPulse 1.1s ease-in-out infinite;
}
#splash .dots i:nth-child(2){animation-delay:.16s;background:#5A9BFB;}
#splash .dots i:nth-child(3){animation-delay:.32s;background:#2F6FE4;}

@keyframes logoIn{
  0%{opacity:0;transform:scale(.55) translateY(18px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
@keyframes nameIn{
  0%{opacity:0;transform:translateY(10px);}
  100%{opacity:1;transform:translateY(0);}
}
@keyframes dotPulse{
  0%,80%,100%{transform:scale(1);opacity:.42;}
  40%{transform:scale(1.45);opacity:1;}
}

/* ============ 手機外框 ============ */
#phone{
  position:relative;
  width:min(100vw,56.25vh);
  height:min(177.78vw,100vh);
  background:radial-gradient(120% 80% at 50% 0%,#FFFFFF 0%,#F2F8FF 55%,#E4EEFF 100%);
  overflow:hidden;
  border-radius:clamp(0px,3.6vmin,42px);
  box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  isolation:isolate;
}
@media (display-mode: standalone){
  #phone{
    width:100vw;height:100vh;
    border-radius:0;
    box-shadow:none;
  }
  html,body{background:#F2F8FF;}
}
@supports (height:100dvh){
  #phone{width:min(100vw,56.25dvh);height:min(177.78vw,100dvh);}
  @media (display-mode: standalone){
    #phone{width:100vw;height:100dvh;}
  }
}
#phone::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(59,130,246,.13) 1.2px,transparent 1.3px);
  background-size:18px 18px;
  pointer-events:none;z-index:0;
}

#fx{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:50;
}

.view{
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;
}

/* ============ 頂部（班級 + 進度） ============ */
#viewMain{
  padding:
    calc(16px + env(safe-area-inset-top))
    calc(14px + env(safe-area-inset-right))
    calc(16px + env(safe-area-inset-bottom))
    calc(14px + env(safe-area-inset-left));
  gap:12px;
}

.topbar{
  display:flex;
  gap:8px;
  align-items:center;
  flex:0 0 auto;
}

.class-btn{
  border:none;
  font-family:inherit;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:999px;
  padding:9px 11px 9px 14px;
  display:flex;
  align-items:center;
  gap:5px;
  color:#2563EB;
  font-size:13px;
  font-weight:900;
  letter-spacing:.02em;
  box-shadow:0 6px 20px rgba(59,130,246,.13),inset 0 0 0 1px rgba(255,255,255,.75);
  cursor:pointer;
  max-width:132px;
  min-width:70px;
  flex:0 0 auto;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.class-btn:active{transform:scale(.95);}
.class-btn .label{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
  min-width:0;
  text-align:left;
}
.class-btn svg{
  flex:0 0 auto;
  opacity:.75;
}

.hud{
  display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:999px;
  padding:9px 16px 9px 15px;
  box-shadow:0 6px 20px rgba(59,130,246,.13),inset 0 0 0 1px rgba(255,255,255,.75);
  flex:1;
  min-width:0;
  transition:box-shadow .4s ease;
}
.hud.complete{box-shadow:0 6px 26px rgba(59,130,246,.42),inset 0 0 0 1.5px rgba(59,130,246,.38);}
.hud-track{
  flex:1;height:9px;border-radius:5px;
  background:#DBE8FF;overflow:hidden;position:relative;
}
.hud-fill{
  height:100%;width:0%;border-radius:5px;
  background:linear-gradient(90deg,#93C5FD,#3B82F6 60%,#2563EB);
  transition:width .45s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 10px rgba(59,130,246,.6);
}
.hud-count{
  font-size:13.5px;font-weight:900;color:#2563EB;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
  min-width:52px;text-align:right;
}
.hud-count b{font-size:15px;}
.hud-count span{opacity:.45;font-weight:800;}

/* ============ 學生網格 ============ */
.grid-wrap{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:2px 2px 6px;
  scrollbar-width:none;
}
.grid-wrap::-webkit-scrollbar{display:none;}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  align-content:start;
}

.empty-state{
  grid-column:1 / -1;
  text-align:center;
  padding:60px 20px;
  color:#8CA6CE;
}
.empty-state .em-title{
  font-size:15px;
  font-weight:900;
  color:#5E90D6;
  margin-bottom:8px;
}
.empty-state .em-sub{
  font-size:12.5px;
  font-weight:700;
  line-height:1.5;
}

/* ============ 學生卡片 ============ */
.card{
  position:relative;
  aspect-ratio:1/1;
  border-radius:16px;
  background:linear-gradient(155deg,#8FBEFF 0%,#5A9BFB 46%,#2F6FE4 100%);
  box-shadow:
    0 4px 0 #2258C0,
    0 7px 16px rgba(47,111,228,.32),
    inset 0 1px 0 rgba(255,255,255,.55);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:#fff;
  cursor:pointer;
  touch-action:manipulation;
  overflow:hidden;
  will-change:transform,opacity;
  transform:translateZ(0);
  transition:
    transform .17s cubic-bezier(.34,1.56,.64,1),
    box-shadow .17s ease,
    filter .17s ease;
  animation:cardIn .42s cubic-bezier(.34,1.56,.64,1) backwards;
  animation-delay:calc(var(--i,0) * 24ms);
}

@keyframes cardIn{
  0%{opacity:0;transform:scale(.55) translateY(12px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

.card .num{
  position:absolute;top:4px;left:4px;
  font-size:9px;font-weight:900;
  color:#FFFFFF;
  background:rgba(20,48,110,.62);
  padding:1.5px 6px;
  border-radius:8px;
  line-height:1.25;
  letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
  box-shadow:0 1px 3px rgba(10,28,70,.28);
}

.card .name{
  font-size:13px;font-weight:900;
  line-height:1.08;
  text-align:center;
  padding:0 3px;
  letter-spacing:.02em;
  color:#FFFFFF;
  text-shadow:
    0 1px 2px rgba(14,38,88,.55),
    0 2px 6px rgba(14,38,88,.32);
  word-break:break-word;
  max-width:100%;
}

.card.pressing{
  transform:scale(.855) translateY(3px);
  box-shadow:
    0 1px 0 #2258C0,
    0 2px 6px rgba(47,111,228,.18),
    inset 0 2px 6px rgba(0,0,0,.12);
  filter:brightness(.95) saturate(1.1);
  transition:transform .11s cubic-bezier(.4,0,.6,1),box-shadow .11s ease,filter .11s ease;
}

.card.popping{
  z-index:20;
  pointer-events:none;
  animation:popOut .5s cubic-bezier(.3,.9,.4,1) forwards;
}
@keyframes popOut{
  0%  {transform:scale(.86) rotate(0deg);  opacity:1; filter:brightness(1);}
  28% {transform:scale(1.55) rotate(-10deg);opacity:1; filter:brightness(1.45) saturate(1.3);}
  48% {transform:scale(1.26) rotate(8deg); opacity:1; filter:brightness(1.2);}
  100%{transform:scale(.05) rotate(38deg); opacity:0; filter:brightness(2) saturate(.4);}
}

.card.restoring{
  animation:restoreIn .5s cubic-bezier(.34,1.56,.64,1) !important;
  animation-delay:0s !important;
}
@keyframes restoreIn{
  0%  {opacity:0; transform:scale(.05) rotate(38deg);}
  55% {opacity:1; transform:scale(1.32) rotate(-9deg);}
  100%{opacity:1; transform:scale(1) rotate(0deg);}
}

.card.done{
  background:rgba(255,255,255,.80);
  box-shadow:inset 0 0 0 1.5px rgba(59,130,246,.30),0 0 0 0 rgba(0,0,0,0);
  border:0;
  pointer-events:none;
  cursor:default;
  animation:stampIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes stampIn{
  0%{opacity:0;transform:scale(.45) rotate(-8deg);}
  100%{opacity:1;transform:scale(1) rotate(0deg);}
}
.card.done .done-name{
  font-size:11px;font-weight:900;
  color:#1B3A75;
  line-height:1.1;
  text-align:center;
  padding:0 3px;
  max-width:100%;
  word-break:break-word;
  margin-bottom:2px;
}
.card.done .done-time{
  font-size:10.5px;font-weight:900;
  color:#2563EB;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
  background:rgba(219,232,255,.85);
  padding:1px 6px;
  border-radius:7px;
}
.card.done::after{
  content:'';position:absolute;inset:6px;
  border-radius:10px;
  border:1.5px dashed rgba(59,130,246,.32);
  pointer-events:none;
}

/* ============ 底部按鈕 ============ */
.dock{display:flex;gap:8px;flex:0 0 auto;}

.dock-btn{
  flex:1;height:54px;border:none;border-radius:19px;
  font-family:inherit;font-size:13.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;letter-spacing:.03em;
  touch-action:manipulation;
  transition:transform .17s cubic-bezier(.34,1.56,.64,1),box-shadow .17s ease,opacity .25s;
}
.dock-btn svg{width:17px;height:17px;flex:0 0 auto;}

.dock-btn.undo{
  background:#FFFFFF;
  color:#2563EB;
  box-shadow:0 4px 0 #C3DAFF,0 9px 20px rgba(59,130,246,.16);
}
.dock-btn.undo:active{
  transform:translateY(3px) scale(.985);
  box-shadow:0 1px 0 #C3DAFF,0 3px 8px rgba(59,130,246,.12);
}
.dock-btn.undo:disabled{
  opacity:.42;
  cursor:default;
  box-shadow:0 4px 0 #DCE7F8;
  color:#94B4E0;
  pointer-events:none;
}

.dock-btn.reset{
  background:#FFFFFF;
  color:#F0803C;
  box-shadow:0 4px 0 #FFD9C2,0 9px 20px rgba(240,128,60,.16);
}
.dock-btn.reset:active{
  transform:translateY(3px) scale(.985);
  box-shadow:0 1px 0 #FFD9C2,0 3px 8px rgba(240,128,60,.12);
}

.dock-btn.settings{
  background:linear-gradient(160deg,#7FB4FF,#2F6FE4);
  color:#FFFFFF;
  box-shadow:0 4px 0 #2258C0,0 9px 20px rgba(47,111,228,.34);
}
.dock-btn.settings:active{
  transform:translateY(3px) scale(.985);
  box-shadow:0 1px 0 #2258C0,0 3px 8px rgba(47,111,228,.24);
}

/* ============ Sheet（浮層頁）通用 ============ */
.sheet{
  position:absolute;inset:0;z-index:100;
  background:linear-gradient(180deg,#FFFFFF 0%,#F1F7FF 100%);
  display:flex;flex-direction:column;
  padding:
    calc(16px + env(safe-area-inset-top))
    calc(14px + env(safe-area-inset-right))
    calc(16px + env(safe-area-inset-bottom))
    calc(14px + env(safe-area-inset-left));
  transform:translateY(101%);
  transition:transform .46s cubic-bezier(.32,.72,0,1);
  will-change:transform;
}
.sheet.open{transform:translateY(0);}

.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 14px;flex:0 0 auto;gap:10px;
}
.sheet-head h2{
  margin:0;font-size:19px;font-weight:900;color:#1B3A75;letter-spacing:.02em;
}
.sheet-head > div{min-width:0;}
.sheet-sub{
  margin:3px 0 0;
  font-size:12px;
  font-weight:800;
  color:#8CA6CE;
  letter-spacing:.02em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* 返回按鈕 */
.back-btn{
  border:none;
  width:36px;height:36px;
  border-radius:50%;
  background:#EAF2FF;
  color:#2563EB;
  display:grid;place-items:center;
  cursor:pointer;
  flex:0 0 auto;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s;
}
.back-btn:active{transform:scale(.9);background:#DBE8FF;}
.back-btn svg{width:18px;height:18px;}

.chip{
  border:none;font-family:inherit;
  background:linear-gradient(160deg,#7FB4FF,#2F6FE4);
  color:#fff;font-size:13.5px;font-weight:900;
  padding:9px 16px;border-radius:999px;
  box-shadow:0 3px 0 #2258C0,0 6px 14px rgba(47,111,228,.28);
  cursor:pointer;letter-spacing:.05em;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s;
  flex:0 0 auto;
}
.chip:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 #2258C0;}

.sheet-list{
  flex:1;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:2px 2px 8px;
  scrollbar-width:none;
}
.sheet-list::-webkit-scrollbar{display:none;}

.srow{
  display:flex;align-items:center;gap:8px;
  background:#fff;border-radius:15px;
  padding:7px 9px;margin-bottom:8px;
  box-shadow:0 2px 10px rgba(59,130,246,.10),inset 0 0 0 1px rgba(219,232,255,.9);
  animation:rowIn .3s ease backwards;
}
@keyframes rowIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.srow input{
  border:none;outline:none;background:transparent;
  font-family:inherit;font-size:15px;font-weight:800;
  color:#1B3A75;min-width:0;
  -webkit-user-select:text;user-select:text;
}
.srow .sname{flex:1;padding:6px 2px;}
.srow .sname::placeholder{color:#A9C4EA;font-weight:700;}
.srow .snum{
  width:52px;text-align:center;
  background:#EAF2FF;border-radius:10px;
  padding:7px 0;font-size:14px;color:#2563EB;
  font-variant-numeric:tabular-nums;
}
.srow .snum:focus{background:#DBE8FF;box-shadow:0 0 0 2px rgba(59,130,246,.30);}
.srow .sname:focus{background:#F2F7FF;border-radius:10px;}

/* 小圓按鈕（刪除 / 匯出） */
.srow .sdel,
.srow .sexport{
  width:32px;height:32px;flex:0 0 auto;
  border:none;border-radius:50%;
  font-size:15px;font-weight:900;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  font-family:inherit;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s;
}
.srow .sdel{
  background:#FFEDE8;color:#FF7A5C;
}
.srow .sdel:active{transform:scale(.85);background:#FFDCD2;}
.srow .sexport{
  background:#EAF2FF;color:#2563EB;
}
.srow .sexport:active{transform:scale(.85);background:#DBE8FF;}
.srow .sexport svg{width:15px;height:15px;}

.sheet-foot{flex:0 0 auto;padding-top:10px;display:flex;flex-direction:column;gap:10px;}

.backup-row{display:flex;gap:10px;}

.bak-btn{
  flex:1;height:48px;border:none;border-radius:16px;
  font-family:inherit;font-size:13.5px;font-weight:900;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;
  background:#EAF2FF;color:#2563EB;
  box-shadow:0 3px 0 #C3DAFF,0 6px 14px rgba(59,130,246,.14);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,background .15s;
}
.bak-btn:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 #C3DAFF;}
.bak-btn svg{width:16px;height:16px;flex:0 0 auto;}

.big-btn{
  width:100%;height:56px;border:none;border-radius:19px;
  font-family:inherit;font-size:16px;font-weight:900;letter-spacing:.1em;
  color:#fff;cursor:pointer;
  background:linear-gradient(160deg,#7FB4FF,#2F6FE4);
  box-shadow:0 4px 0 #2258C0,0 10px 22px rgba(47,111,228,.30);
  transition:transform .17s cubic-bezier(.34,1.56,.64,1),box-shadow .17s;
}
.big-btn:active{transform:translateY(3px) scale(.99);box-shadow:0 1px 0 #2258C0;}

/* ============ 班級選擇列表項 ============ */
.class-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px 16px;
  background:#fff;
  border-radius:16px;
  margin-bottom:8px;
  box-shadow:0 2px 10px rgba(59,130,246,.10),inset 0 0 0 1px rgba(219,232,255,.9);
  cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
  animation:rowIn .3s ease backwards;
}
.class-item:active{transform:scale(.98);}
.class-item.active{
  box-shadow:0 3px 14px rgba(59,130,246,.22),inset 0 0 0 2px #5A9BFB;
}
.class-item .class-name{
  flex:1;
  font-size:15px;
  font-weight:900;
  color:#1B3A75;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}
.class-item .class-count{
  font-size:12.5px;
  font-weight:800;
  color:#8CA6CE;
  flex:0 0 auto;
  white-space:nowrap;
}
.class-item .class-check{
  width:22px;
  height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  background:transparent;
  flex:0 0 auto;
  transition:background .2s;
}
.class-item.active .class-check{
  background:linear-gradient(160deg,#7FB4FF,#2F6FE4);
  box-shadow:0 2px 6px rgba(47,111,228,.32);
}
.class-item .class-check svg{
  opacity:0;
  transition:opacity .2s;
}
.class-item.active .class-check svg{opacity:1;}

/* ============ 班級管理列表項 ============ */
.class-row .sname{
  font-size:15.5px;
}
.class-row .class-row-count{
  font-size:12px;
  font-weight:800;
  color:#8CA6CE;
  flex:0 0 auto;
  white-space:nowrap;
  padding-right:2px;
}

/* ============ 班級 Sheet 內部模式切換（修正版） ============ */
/* 管理模式元素預設隱藏 */
#classSheet .mode-manage{display:none !important;}

/* 切到管理模式：隱藏選擇模式元素 */
#classSheet.manage .mode-select{display:none !important;}

/* 管理模式元素以正確的 display 型別顯示 */
#classSheet.manage .sheet-head.mode-manage{display:flex !important;}
#classSheet.manage .sheet-list.mode-manage{display:block !important;}
#classSheet.manage .sheet-foot.mode-manage{display:flex !important;}

/* ============ 確認彈窗 ============ */
.mask{
  position:absolute;inset:0;z-index:200;
  background:rgba(12,32,66,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:32px;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
.mask.show{opacity:1;pointer-events:auto;}

.dialog{
  width:100%;max-width:280px;
  background:#fff;border-radius:26px;
  padding:24px 20px 18px;
  text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.28);
  transform:scale(.86) translateY(14px);
  transition:transform .38s cubic-bezier(.34,1.56,.64,1);
}
.mask.show .dialog{transform:scale(1) translateY(0);}

.dialog-title{
  margin:0 0 6px;font-size:16.5px;font-weight:900;color:#1B3A75;letter-spacing:.02em;
}
.dialog-sub{
  margin:0 0 20px;font-size:12.5px;font-weight:700;color:#8CA6CE;line-height:1.45;
}
.dialog-actions{display:flex;gap:10px;}
.dlg-btn{
  flex:1;height:46px;border:none;border-radius:15px;
  font-family:inherit;font-size:14.5px;font-weight:900;letter-spacing:.06em;
  cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),filter .15s;
}
.dlg-btn:active{transform:scale(.95);}
.dlg-btn.ghost{background:#EAF2FF;color:#3B82F6;}
.dlg-btn.danger{
  background:linear-gradient(160deg,#FFB48F,#FF8459);
  color:#fff;box-shadow:0 3px 0 #DE6A44;
}

/* ============ Toast ============ */
#toast{
  position:absolute;left:50%;
  bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:300;
  transform:translate(-50%,18px) scale(.9);
  background:rgba(27,58,117,.94);
  color:#fff;font-size:13px;font-weight:800;letter-spacing:.04em;
  padding:11px 22px;border-radius:999px;
  white-space:nowrap;pointer-events:none;opacity:0;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 10px 30px rgba(0,0,0,.22);
  transition:opacity .34s ease,transform .38s cubic-bezier(.34,1.56,.64,1);
}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1);}

/* ============ 更新提示條 ============ */
#updateBar{
  position:absolute;left:50%;
  top:calc(14px + env(safe-area-inset-top));
  z-index:400;
  transform:translate(-50%,-140%) scale(.9);
  background:linear-gradient(160deg,#7FB4FF,#2F6FE4);
  color:#fff;font-size:12.5px;font-weight:900;letter-spacing:.04em;
  padding:10px 20px;border-radius:999px;
  display:flex;align-items:center;gap:8px;
  white-space:nowrap;pointer-events:none;opacity:0;
  box-shadow:0 8px 24px rgba(47,111,228,.42);
  transition:opacity .34s ease,transform .38s cubic-bezier(.34,1.56,.64,1);
}
#updateBar.show{
  opacity:1;pointer-events:auto;
  transform:translate(-50%,0) scale(1);
}
#updateBar .spin{
  width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* =========================================================
   動態產生 App 圖標
   ========================================================= */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function makeIcon(size){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#7FB4FF');
  grad.addColorStop(0.5, '#5A9BFB');
  grad.addColorStop(1, '#2F6FE4');
  g.fillStyle = grad;
  roundRect(g, 0, 0, size, size, size * 0.22);
  g.fill();
  g.strokeStyle = '#FFFFFF';
  g.lineWidth = size * 0.09;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(size * 0.29, size * 0.53);
  g.lineTo(size * 0.44, size * 0.67);
  g.lineTo(size * 0.73, size * 0.35);
  g.stroke();
  return c.toDataURL('image/png');
}

function setupPWA(){
  const icon192 = makeIcon(192);
  const icon512 = makeIcon(512);

  const manifest = {
    name: '簽到',
    short_name: '簽到',
    description: '課堂簽到工具',
    start_url: '.',
    scope: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#F2F8FF',
    theme_color: '#2563EB',
    lang: 'zh-Hant',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
    ]
  };
  try{
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const url  = URL.createObjectURL(blob);
    let link = document.querySelector('link[rel="manifest"]');
    if(!link){
      link = document.createElement('link');
      link.rel = 'manifest';
      document.head.appendChild(link);
    }
    link.href = url;
  }catch(e){}

  document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="apple-touch-icon-precomposed"]')
    .forEach(el => el.remove());
  const ati = document.createElement('link');
  ati.rel = 'apple-touch-icon';
  ati.href = icon192;
  document.head.appendChild(ati);

  document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"]').forEach(el => el.remove());
  const fav = document.createElement('link');
  fav.rel = 'icon';
  fav.type = 'image/png';
  fav.href = makeIcon(64);
  document.head.appendChild(fav);
}

/* =========================================================
   音效系統
   ========================================================= */
const Sound = (function(){
  let ac = null;
  function ctx(){
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ac = new AC();
    }
    if(ac.state === 'suspended'){ ac.resume().catch(()=>{}); }
    return ac;
  }
  function press(){
    const a = ctx(); if(!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); const g = a.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(720,t);
    o.frequency.exponentialRampToValueAtTime(340,t+0.075);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.075,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.095);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+0.11);
  }
  function signIn(){
    const a = ctx(); if(!a) return;
    const t0 = a.currentTime;
    [{f:659.25,t:0,d:0.28},{f:987.77,t:0.07,d:0.38}].forEach(n=>{
      const o=a.createOscillator(); const g=a.createGain();
      o.type='triangle';
      o.frequency.setValueAtTime(n.f,t0+n.t);
      g.gain.setValueAtTime(0.0001,t0+n.t);
      g.gain.linearRampToValueAtTime(0.11,t0+n.t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n.t+n.d);
      o.connect(g); g.connect(a.destination);
      o.start(t0+n.t); o.stop(t0+n.t+n.d+0.02);
    });
  }
  function undo(){
    const a = ctx(); if(!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); const g = a.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(560,t);
    o.frequency.exponentialRampToValueAtTime(210,t+0.2);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.085,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+0.26);
  }
  function nope(){
    const a = ctx(); if(!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); const g = a.createGain();
    o.type='square';
    o.frequency.setValueAtTime(180,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.045,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+0.15);
  }
  function fanfare(){
    const a = ctx(); if(!a) return;
    const t0 = a.currentTime;
    [523.25,659.25,783.99,1046.50].forEach((f,i)=>{
      const o=a.createOscillator(); const g=a.createGain();
      const t = t0 + i*0.085;
      o.type='triangle';
      o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.1,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t+0.47);
    });
  }
  function unlock(){
    const a = ctx();
    if(a && a.state === 'suspended') a.resume().catch(()=>{});
  }
  return { press, signIn, undo, nope, fanfare, unlock };
})();

/* =========================================================
   IndexedDB 儲存層（v2：班級制）
   ========================================================= */
const DB_NAME = 'qian-dao-db';
const DB_VER  = 2;
const STORE_CLASSES = 'classes';
const STORE_META = 'meta';

let db = null;
let storageOK = false;

function openDB(){
  return new Promise((resolve, reject) => {
    if(!window.indexedDB){ reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      const tx = e.target.transaction;

      if(!d.objectStoreNames.contains(STORE_CLASSES)){
        d.createObjectStore(STORE_CLASSES, { keyPath: 'id' });
      }
      if(!d.objectStoreNames.contains(STORE_META)){
        d.createObjectStore(STORE_META, { keyPath: 'key' });
      }

      if(e.oldVersion < 2 && d.objectStoreNames.contains('students')){
        const oldStore = tx.objectStore('students');
        const oldReq = oldStore.getAll();
        oldReq.onsuccess = () => {
          const oldStudents = oldReq.result || [];
          const classId = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
          const cls = {
            id: classId,
            name: '我的班級',
            students: oldStudents.length ? oldStudents : []
          };
          tx.objectStore(STORE_CLASSES).put(cls);
          tx.objectStore(STORE_META).put({ key: 'currentClassId', value: classId });
        };
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
    req.onblocked = () => reject(new Error('blocked'));
  });
}

function dbGetAllClasses(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CLASSES, 'readonly');
    const st = tx.objectStore(STORE_CLASSES);
    const req = st.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror   = () => reject(req.error);
  });
}

function dbPutClass(cls){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CLASSES, 'readwrite');
    const st = tx.objectStore(STORE_CLASSES);
    st.put(cls);
    tx.oncomplete = () => resolve();
    tx.onerror    = () => reject(tx.error);
    tx.onabort    = () => reject(tx.error);
  });
}

function dbDeleteClass(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CLASSES, 'readwrite');
    const st = tx.objectStore(STORE_CLASSES);
    st.delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror    = () => reject(tx.error);
    tx.onabort    = () => reject(tx.error);
  });
}

function dbGetMeta(key){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_META, 'readonly');
    const st = tx.objectStore(STORE_META);
    const req = st.get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror   = () => reject(req.error);
  });
}

function dbPutMeta(key, value){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_META, 'readwrite');
    const st = tx.objectStore(STORE_META);
    st.put({ key, value });
    tx.oncomplete = () => resolve();
    tx.onerror    = () => reject(tx.error);
    tx.onabort    = () => reject(tx.error);
  });
}

/* =========================================================
   狀態
   ========================================================= */
const DEFAULT_NAMES = [
  '陳大文','林小明','黃美玲','張家豪','李靜怡',
  '王俊傑','劉思穎','吳嘉俊','陳婉婷','周文軒',
  '鄭雅文','何俊宇','馬嘉欣','羅志明','楊凱琳',
  '徐子豪','許佩珊','蔡明軒','曾雅琳','彭浩宇',
  '潘家豪','蘇文靜','盧俊宏','廖美琪','葉志強',
  '蔣欣怡','韓子軒','馮雅婷','沈浩然','謝婉君'
];

let uidCounter = 0;
function uid(){ return 's' + (Date.now().toString(36)) + (uidCounter++).toString(36); }

let classUidCounter = 0;
function classUid(){ return 'c' + Date.now().toString(36) + (classUidCounter++).toString(36); }

function defaultStudents(){
  return DEFAULT_NAMES.map((name,i)=>({
    id: uid(), num: i+1, name, time: null
  }));
}

let classes = [];
let currentClassId = null;
let students = [];
let undoStack = [];

function normalize(s){
  return {
    id: s.id || uid(),
    num: s.num ?? '',
    name: s.name ?? '',
    time: s.time ?? null
  };
}

function normalizeClass(c){
  return {
    id: c.id || classUid(),
    name: (c.name != null && String(c.name).trim() !== '') ? String(c.name) : '未命名班級',
    students: Array.isArray(c.students) ? c.students.map(normalize) : []
  };
}

function getCurrentClass(){
  return classes.find(c => c.id === currentClassId) || null;
}

async function save(){

let CW = 0, CH = 0;
let pendingImportMode = 'replace-current';

/* =========================================================
   粒子系統
   ========================================================= */
const PALETTE = ['#5A9BFB','#93C5FD','#C9E2FF','#FFFFFF','#FFD86B','#7FE7FF','#2F6FE4'];
let particles = [];
let rings = [];
let running = false;

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  CW = canvas.clientWidth;
  CH = canvas.clientHeight;
  canvas.width  = Math.max(1, Math.round(CW * dpr));
  canvas.height = Math.max(1, Math.round(CH * dpr));
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function burst(x, y, count){
  count = count || 26;
  for(let i = 0; i < count; i++){
    const a  = Math.random() * Math.PI * 2;
    const sp = 1.4 + Math.random() * 6.8;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.6,
      life: 1,
      decay: 0.011 + Math.random() * 0.020,
      size: 1.6 + Math.random() * 4.6,
      color: PALETTE[(Math.random() * PALETTE.length) | 0],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .38,
      round: Math.random() < .48,
      g: 0.13 + Math.random() * 0.13
    });
  }
  rings.push({ x, y, r: 6, life: 1, maxR: 44 + Math.random() * 26 });
  startLoop();
}

function startLoop(){
  if(running) return;
  running = true;
  requestAnimationFrame(tick);
}

function tick(){
  ctx2d.clearRect(0, 0, CW, CH);

  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.g;
    p.vx *= 0.982; p.vy *= 0.982;
    p.rot += p.vr;
    p.life -= p.decay;

    if(p.life <= 0 || p.y > CH + 40){ particles.splice(i, 1); continue; }

    ctx2d.save();
    ctx2d.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx2d.translate(p.x, p.y);
    ctx2d.rotate(p.rot);
    ctx2d.fillStyle = p.color;
    if(p.round){
      ctx2d.beginPath();
      ctx2d.arc(0, 0, Math.max(0.4, p.size * p.life), 0, Math.PI * 2);
      ctx2d.fill();
    }else{
      const s = p.size * 1.7;
      ctx2d.fillRect(-s / 2, -s / 2, s, Math.max(0.6, s * p.life));
    }
    ctx2d.restore();
  }

  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.r += (r.maxR - r.r) * 0.18 + 1.2;
    r.life -= 0.055;
    if(r.life <= 0){ rings.splice(i, 1); continue; }

    ctx2d.save();
    ctx2d.globalAlpha = Math.max(0, r.life) * 0.55;
    ctx2d.strokeStyle = '#5A9BFB';
    ctx2d.lineWidth = 2.5 * r.life;
    ctx2d.beginPath();
    ctx2d.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx2d.stroke();
    ctx2d.restore();
  }

  if(particles.length || rings.length){
    requestAnimationFrame(tick);
  }else{
    running = false;
    ctx2d.clearRect(0, 0, CW, CH);
  }
}

/* =========================================================
   工具
   ========================================================= */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function nowTime(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    phone.appendChild(el);
  }
  el.textContent = msg;
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1900);
}

let confirmCallback = null;
function showConfirm(title, sub, cb){

  document.getElementById('confirmSub').textContent = sub;

/* =========================================================
   渲染：主網格
   ========================================================= */
function sortedStudents(){
  return [...students].sort((a, b) => {
    const na = Number(a.num), nb = Number(b.num);
    const va = isNaN(na) ? Infinity : na;
    const vb = isNaN(nb) ? Infinity : nb;
    if(va === vb) return 0;
    return va - vb;
  });
}

function doneInnerHtml(s){
  return '<span class="done-name">' + escapeHtml(s.name) + '</span>' +
         '<span class="done-time">' + escapeHtml(s.time) + '</span>';
}

function render(){
  const list = sortedStudents();
  grid.innerHTML = '';

  if(!list.length){
    const em = document.createElement('div');
    em.className = 'empty-state';
    em.innerHTML =
      '<div class="em-title">還沒有學生</div>' +
      '<div class="em-sub">點擊下方「設定」按鈕<br>新增學生到此班級</div>';
    grid.appendChild(em);
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    card.style.setProperty('--i', Math.min(i, 14));

    if(s.time){
      card.classList.add('done');
      card.innerHTML = doneInnerHtml(s);
    }else{
      card.innerHTML =
        '<span class="num">' + escapeHtml(s.num) + '</span>' +
        '<span class="name">' + escapeHtml(s.name) + '</span>';
      attachCardEvents(card, s);
    }
    frag.appendChild(card);
  });

  grid.appendChild(frag);
}

/* =========================================================
   卡片事件
   ========================================================= */
function attachCardEvents(card, s){
  let active = false;
  let downX = 0, downY = 0;

  card.addEventListener('pointerdown', (e) => {
    if(s.time) return;
    if(e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    active = true;
    downX = e.clientX;
    downY = e.clientY;
    card.classList.add('pressing');
    Sound.press();
    vibrate(8);
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
  });

  card.addEventListener('pointerup', (e) => {
    if(!active) return;
    active = false;
    card.classList.remove('pressing');

    if(Math.abs(e.clientX - downX) > 12 || Math.abs(e.clientY - downY) > 12) return;
    if(s.time) return;

    doSignIn(card, s);
  });

  card.addEventListener('pointercancel', () => {
    active = false;
    card.classList.remove('pressing');
  });

  card.addEventListener('lostpointercapture', () => {
    if(active){
      active = false;
      card.classList.remove('pressing');
    }
  });

  card.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* =========================================================
   簽到
   ========================================================= */
function doSignIn(card, s){
  if(s.time) return;

  s.time = nowTime();
  undoStack.push(s.id);
  save();
  updateHud();
  updateUndoBtn();

  card.classList.remove('pressing');
  card.classList.add('popping');

  const cr = canvas.getBoundingClientRect();
  const r  = card.getBoundingClientRect();
  const cx = r.left - cr.left + r.width / 2;
  const cy = r.top  - cr.top  + r.height / 2;

  Sound.signIn();
  vibrate([10, 26, 14]);

  setTimeout(() => burst(cx, cy, 28), 80);

  setTimeout(() => {
    card.classList.remove('popping');
    card.classList.add('done');
    card.innerHTML = doneInnerHtml(s);

    if(students.length && students.every(x => x.time)){
      celebrate();
    }
  }, 480);
}

function celebrate(){
  Sound.fanfare();
  vibrate([16, 50, 16, 50, 26]);
  for(let i = 0; i < 7; i++){
    setTimeout(() => {
      burst(
        CW * (0.12 + Math.random() * 0.76),
        CH * (0.16 + Math.random() * 0.5),
        30
      );
    }, i * 120);
  }
  setTimeout(() => toast('全部簽到完成 🎉'), 260);
}

/* =========================================================
   撤銷
   ========================================================= */
function updateUndoBtn(){
  btnUndo.disabled = undoStack.length === 0;
}

function undoLast(){
  while(undoStack.length){
    const id = undoStack.pop();
    const s = students.find(x => x.id === id);
    if(s && s.time){
      s.time = null;
      save();
      updateHud();
      updateUndoBtn();

      Sound.undo();
      vibrate(14);

      const card = grid.querySelector('[data-id="' + id + '"]');
      if(card){
        card.classList.remove('done');
        card.classList.add('restoring');
        card.style.setProperty('--i', 0);
        card.innerHTML =
          '<span class="num">' + escapeHtml(s.num) + '</span>' +
          '<span class="name">' + escapeHtml(s.name) + '</span>';
        attachCardEvents(card, s);

        const cr = canvas.getBoundingClientRect();
        const r  = card.getBoundingClientRect();
        if(r.width){
          burst(
            r.left - cr.left + r.width / 2,
            r.top  - cr.top  + r.height / 2,
            16
          );
        }

        setTimeout(() => card.classList.remove('restoring'), 520);
      }
      return;
    }
  }
  Sound.nope();
  toast('沒有可撤銷的簽到');
}

async function deleteClass(id){

/* =========================================================
   匯出：單一班級
   ========================================================= */
function exportClassFile(cls){
  if(!cls) return;

  if(cls.id === currentClassId) cls.students = students;

  const data = JSON.stringify({
    app: 'qian-dao',
    version: 3,
    type: 'class',
    exportedAt: new Date().toISOString(),
    class: {
      name: cls.name,
      students: cls.students
    }
  }, null, 2);

  const blob = new Blob([data], { type:'application/json' });
  const url  = URL.createObjectURL(blob);

  const d = new Date();
  const safe = String(cls.name || '班級').replace(/[\\/:*?"<>|]/g, '_').trim() || '班級';
  const fname = safe + '_' +
    d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' +
    pad(d.getHours()) + pad(d.getMinutes()) + '.json';

  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);

  Sound.signIn();
  vibrate(12);
  toast('已匯出「' + cls.name + '」');
}

/* =========================================================
   匯入：解析
   ========================================================= */
function extractClasses(parsed){
  if(!parsed) return [];

  if(parsed.class && Array.isArray(parsed.class.students)){
    return [{
      name: parsed.class.name || '匯入班級',
      students: parsed.class.students
    }];
  }

  if(Array.isArray(parsed.classes)){
    return parsed.classes
      .filter(c => c && Array.isArray(c.students))
      .map(c => ({
        name: c.name || '匯入班級',
        students: c.students
      }));
  }

  if(Array.isArray(parsed.students)){
    return [{
      name: parsed.name || '匯入班級',
      students: parsed.students
    }];
  }

  if(Array.isArray(parsed)){
    return [{ name: '匯入班級', students: parsed }];
  }

  return [];
}

/* =========================================================
   匯入處理
   ========================================================= */
function handleImportFile(file, mode){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
    }catch(e){
      Sound.nope();
      toast('檔案格式不正確');
      return;
    }

    const parsedClasses = extractClasses(parsed);
    if(!parsedClasses.length){
      Sound.nope();
      toast('檔案中沒有學生資料');
      return;
    }

    if(mode === 'replace-current'){
      const src = parsedClasses[0];
      const cls = getCurrentClass();
      const clsName = cls ? cls.name : '當前班級';
      const newStudents = src.students.map(normalize);

      if(!newStudents.length){
        Sound.nope();
        toast('檔案中沒有學生');
        return;
      }

      showConfirm(
        '匯入到本班',
        '「' + clsName + '」目前的 ' + students.length + ' 位學生將被替換為 ' + newStudents.length + ' 位，確定嗎？',
        () => doReplaceStudents(newStudents)
      );
    }else{
      doAddClasses(parsedClasses);
    }
  };
  reader.onerror = () => {
    Sound.nope();
    toast('讀取檔案失敗');
  };
  reader.readAsText(file);
}

async function doReplaceStudents(newStudents){
  students = newStudents;
  undoStack = [];
  const cls = getCurrentClass();
  if(cls){
    cls.students = students;
    if(db){ try{ await dbPutClass(cls); }catch(_){} }
  }
  renderSettings();
  render();
  updateHud();
  updateUndoBtn();
  Sound.signIn();
  vibrate([12, 40, 12]);
  toast('已匯入 ' + students.length + ' 位學生');
}

async function doAddClasses(parsedClasses){
  let added = 0;
  for(const pc of parsedClasses){
    const newCls = {
      id: classUid(),
      name: (pc.name && String(pc.name).trim()) || ('匯入班級 ' + (classes.length + 1)),
      students: pc.students.map(normalize)
    };
    if(!newCls.students.length) continue;
    classes.push(newCls);
    if(db){ try{ await dbPutClass(newCls); }catch(_){} }
    added++;
  }
  renderClassManageList();
  if(added === 0){
    Sound.nope();
    toast('檔案中沒有有效班級');
    return;
  }
  Sound.signIn();
  vibrate([12, 40, 12]);
  toast('已匯入 ' + added + ' 個班級');
}

/* =========================================================
   綁定 UI
   ========================================================= */
function bindUI(){

  const unlock = () => {
    Sound.unlock();
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('mousedown', unlock);
  };
  document.addEventListener('touchstart', unlock, { once:true, passive:true });
  document.addEventListener('mousedown', unlock, { once:true });

  /* --- 撤銷 --- */
  btnUndo.addEventListener('click', undoLast);

  /* --- 重置 --- */
  document.getElementById('btnReset').addEventListener('click', () => {
    Sound.press();
    vibrate(10);
    if(countDone() === 0){ Sound.nope(); toast('尚未有任何簽到'); return; }
    mask.classList.add('show');
  });

  document.getElementById('btnCancel').addEventListener('click', () => {
    Sound.press();
    mask.classList.remove('show');
  });

  mask.addEventListener('click', (e) => {
    if(e.target === mask){
      Sound.press();
      mask.classList.remove('show');
    }
  });

  document.getElementById('btnConfirm').addEventListener('click', () => {
    mask.classList.remove('show');
    students.forEach(s => s.time = null);
    undoStack = [];
    save();
    render();
    updateHud();
    updateUndoBtn();
    Sound.undo();
    vibrate([12, 40, 12]);
    toast('已重置全部紀錄');
  });

  /* --- 設定頁 --- */
  document.getElementById('btnSettings').addEventListener('click', () => {
    Sound.press();
    vibrate(8);
    renderSettings();
    openSheet(viewSettings);
  });

  document.getElementById('btnCloseSettings').addEventListener('click', () => {
    Sound.press();
    students = students.filter(s => String(s.name).trim() !== '' || String(s.num).trim() !== '');
    save();
    closeSheet(viewSettings);
    render();
    updateHud();
    updateUndoBtn();
  });

  document.getElementById('btnAdd').addEventListener('click', () => {
  const maxNum = students.reduce((m, s) => {
    const n = Number(s.num);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  students.push({ id: uid(), num: maxNum + 1, name: '', time: null });
  save();
  renderSettings();
  Sound.press();

  /* 只滾動 sheet-list 內部，不影響頁面其他部分 */
  requestAnimationFrame(() => {
    try{
      studentList.scrollTo({ top: studentList.scrollHeight, behavior: 'smooth' });
    }catch(_){
      studentList.scrollTop = studentList.scrollHeight;
    }
  });

  /* focus 時 preventScroll，避免 iOS 自動捲動整個頁面 */
  const last = studentList.lastElementChild;
  if(last){
    setTimeout(() => {
      const inp = last.querySelector('.sname');
      if(inp){
        try{ inp.focus({ preventScroll: true }); }
        catch(_){ inp.focus(); }
      }
    }, 360);
  }
  vibrate(8);
});

  /* --- 設定頁：匯出本班 / 匯入到本班 --- */
  document.getElementById('btnExport').addEventListener('click', () => {
    const cls = getCurrentClass();
    if(!cls){ Sound.nope(); return; }
    Sound.press();
    exportClassFile(cls);
  });

  document.getElementById('btnImport').addEventListener('click', () => {
    Sound.press();
    pendingImportMode = 'replace-current';
    fileInput.click();
  });

  /* --- 班級選擇 --- */
  document.getElementById('btnClass').addEventListener('click', () => {
    Sound.press();
    vibrate(8);
    showSelectMode();
    openSheet(classSheet);
  });

  /* --- 切換到管理模式（同一個 sheet 內） --- */
  document.getElementById('btnManageClasses').addEventListener('click', () => {
    Sound.press();
    vibrate(8);
    showManageMode();
  });

  /* --- 從管理模式返回選擇模式 --- */
  document.getElementById('btnBackFromManage').addEventListener('click', () => {
    Sound.press();
    showSelectMode();
  });

  /* --- 管理模式的「完成」：直接關閉 sheet --- */
  document.getElementById('btnCloseClassManage').addEventListener('click', () => {
    Sound.press();
    closeSheet(classSheet);
    updateClassLabel();
  });

  document.getElementById('btnAddClass').addEventListener('click', () => {
    Sound.press();
    addClass();
  });

  document.getElementById('btnImportClass').addEventListener('click', () => {
    Sound.press();
    pendingImportMode = 'new-class';
    fileInput.click();
  });

  /* --- 檔案選擇器 --- */
  fileInput.addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!f) return;
    handleImportFile(f, pendingImportMode || 'replace-current');
  });

  /* --- 通用確認彈窗 --- */
  document.getElementById('confirmCancel').addEventListener('click', () => {
    Sound.press();
    confirmMask.classList.remove('show');
    confirmCallback = null;
  });

  document.getElementById('confirmOk').addEventListener('click', () => {
    confirmMask.classList.remove('show');
    const cb = confirmCallback;
    confirmCallback = null;
    if(cb) cb();
  });

  confirmMask.addEventListener('click', (e) => {
    if(e.target === confirmMask){
      confirmMask.classList.remove('show');
      confirmCallback = null;
    }
  });

  /* --- 視窗尺寸 --- */
  if(window.ResizeObserver){
    new ResizeObserver(resizeCanvas).observe(canvas);
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 260));
  document.addEventListener('gesturestart', e => e.preventDefault());

  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){
      resizeCanvas();
      ctx2d.clearRect(0, 0, CW, CH);
    }
  });
}

/* =========================================================
   Service Worker —— 帶自動更新
   ========================================================= */
function showUpdateBar(msg){
  if(!updateBar) return;
  updateText.textContent = msg || '正在更新…';
  updateBar.classList.add('show');
}

function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost') return;

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope:'./' })
      .then(reg => {
        console.log('✓ SW 已註冊');

        reg.update().catch(()=>{});

        if(reg.waiting && navigator.serviceWorker.controller){
          showUpdateBar('發現新版本，正在套用…');
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }

        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if(!nw) return;

          nw.addEventListener('statechange', () => {
            if(nw.state === 'installed' && navigator.serviceWorker.controller){
              showUpdateBar('發現新版本，正在套用…');
              try{ nw.postMessage({ type: 'SKIP_WAITING' }); }catch(_){}
            }
          });
        });
      })
      .catch(err => console.log('SW 註冊失敗：', err.message));

    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(refreshed) return;
      refreshed = true;
      showUpdateBar('更新完成，重新載入…');
      setTimeout(() => {
        try{ window.location.reload(); }catch(_){}
      }, 420);
    });
  });
}

/* =========================================================
   啟動
   ========================================================= */
(async function init(){
  setupPWA();
  registerSW();

  try{
    db = await openDB();
    classes = await dbGetAllClasses();

    if(!classes.length){
      const cls = {
        id: classUid(),
        name: '我的班級',
        students: defaultStudents()
      };
      await dbPutClass(cls);
      classes = [cls];
      await dbPutMeta('currentClassId', cls.id);
      currentClassId = cls.id;
    }else{
      let cid = await dbGetMeta('currentClassId');
      if(!cid || !classes.find(c => c.id === cid)){
        cid = classes[0].id;
        await dbPutMeta('currentClassId', cid);
      }
      currentClassId = cid;
      classes = classes.map(c => ({
        id: c.id || classUid(),
        name: c.name || '未命名班級',
        students: Array.isArray(c.students) ? c.students : []
      }));
    }

    loadClassStudents();
    storageOK = true;
  }catch(e){
    console.warn('IndexedDB unavailable, fallback to memory', e);
    const cls = {
      id: classUid(),
      name: '我的班級',
      students: defaultStudents()
    };
    classes = [cls];
    currentClassId = cls.id;
    loadClassStudents();
    storageOK = false;
  }

  resizeCanvas();
  bindUI();
  updateClassLabel();
  render();
  updateHud();
  updateUndoBtn();

  const wait = storageOK ? 480 : 900;
  setTimeout(() => {
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 700);
  }, wait);

  if(!storageOK){
    setTimeout(() => toast('⚠️ 儲存不可用，請用匯出備份'), 1100);
  }
})();
</script>
